<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- QAVERIN FAVICON -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- BASIC SEO -->
    <title>Qaverin | Luxury Perfumes & Fine Fragrances</title>

    <meta
      name="description"
      content="Discover Qaverin's collection of fine fragrances and luxury perfumes for men and women. Explore elegant scents designed for every occasion."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="author"
      content="Qaverin"
    />

    <!-- CANONICAL URL -->
    <link
      rel="canonical"
      href="https://qaverin-perfume-ecommerce.vercel.app/"
    />

    <!-- OPEN GRAPH / SOCIAL SHARING -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Qaverin | Luxury Perfumes & Fine Fragrances"
    />

    <meta
      property="og:description"
      content="Explore Qaverin's collection of fine fragrances and luxury perfumes for men and women."
    />

    <meta
      property="og:url"
      content="https://qaverin-perfume-ecommerce.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Qaverin"
    />

    <meta
      property="og:image"
      content="https://qaverin-perfume-ecommerce.vercel.app/favicon.png"
    />

    <!-- TWITTER / X SHARING -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Qaverin | Luxury Perfumes & Fine Fragrances"
    />

    <meta
      name="twitter:description"
      content="Explore Qaverin's collection of fine fragrances and luxury perfumes for men and women."
    />

    <meta
      name="twitter:image"
      content="https://qaverin-perfume-ecommerce.vercel.app/favicon.png"
    />

    <!-- CASHFREE -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
